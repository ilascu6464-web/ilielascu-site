<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioSIX - Ilie Lascu Music</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RadioSIX">
    <link rel="apple-touch-icon" href="assets/radiosix_app_icon.png?v=202608060702">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-glow: rgba(57, 255, 20, 0.3);
            --bg-dark: #070709;
            --card-bg: #0e0e11;
            --sidebar-bg: #131317;
            --meta-bg: #191920;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --border-color: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient subtle green glow in the background */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.06) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* Landscape Player Card Layout */
        .player-card {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 860px;
            height: 540px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column; /* Stack top split section and bottom player */
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Split Section: Sidebar (Left) + Lists (Right) */
        .player-top-section {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
            height: calc(100% - 100px); /* Leave 100px for bottom player */
            overflow: hidden;
        }

        /* LEFT SIDEBAR (Navigation only) */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
        }

        .brand-header {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulseDot 1s infinite alternate;
        }

        @keyframes pulseDot {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Vertical Navigation Menu */
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            outline: none;
        }

        .nav-btn svg {
            fill: var(--text-muted);
            transition: fill 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-btn:hover svg {
            fill: var(--text-main);
        }

        .nav-btn.active {
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.06);
            box-shadow: inset 0 0 0 1px rgba(57, 255, 20, 0.15);
        }

        .nav-btn.active svg {
            fill: var(--neon-green);
            filter: drop-shadow(0 0 4px var(--neon-glow));
        }

        /* RIGHT MAIN CONTENT AREA */
        .main-content {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Custom Scrollbar for Right Area */
        .main-content::-webkit-scrollbar {
            width: 6px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
        }

        .screen-title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .screen-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .screen-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Screens content containers */
        .content-screen {
            display: none;
            width: 100%;
        }

        .content-screen.active {
            display: block;
        }

        /* Track and Album lists styles */
        .track-list, .albums-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .track-item, .album-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-item:hover, .album-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .track-item.active, .album-card.active {
            background: rgba(57, 255, 20, 0.04);
            border-color: rgba(57, 255, 20, 0.25);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
            flex-grow: 1;
        }

        .track-num {
            font-size: 13px;
            color: var(--text-muted);
            width: 24px;
            text-align: center;
        }

        .track-item.active .track-num, .album-card.active .track-num {
            color: var(--neon-green);
        }

        .track-cover-mini {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .track-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-name, .album-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item.active .track-name, .album-card.active .album-title {
            color: var(--neon-green);
            font-weight: 600;
        }

        .album-tracks-count {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .track-playing-indicator {
            font-size: 12px;
            color: var(--neon-green);
            display: none;
            align-items: center;
            gap: 6px;
        }

        .track-item.active .track-playing-indicator,
        .album-card.active .track-playing-indicator {
            display: flex;
        }

        /* BOTTOM PLAYER BAR - LARGE & WIDE */
        .bottom-player {
            height: 100px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            flex-shrink: 0;
        }

        .bottom-player .mini-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 33%;
            min-width: 180px;
        }

        .mini-cover-art-container {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .mini-cover-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mini-cover-art.loaded {
            opacity: 1;
        }

        .mini-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mini-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Large & Wide Playback Controls Row */
        .playback-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 34%;
        }

        .mini-control-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .mini-control-btn svg {
            fill: rgba(255, 255, 255, 0.5);
            transition: fill 0.2s ease, filter 0.2s ease;
        }

        .mini-control-btn:hover svg {
            fill: var(--text-main);
        }

        .mini-control-btn.btn-play-pause {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .mini-control-btn.btn-play-pause:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .mini-control-btn.btn-play-pause:hover svg {
            fill: var(--neon-green);
            filter: drop-shadow(0 0 6px var(--neon-glow));
        }

        .mini-control-btn.btn-play-pause:active {
            transform: scale(0.95);
        }

        .mini-control-btn.active svg {
            fill: var(--neon-green);
            filter: drop-shadow(0 0 8px var(--neon-glow));
        }

        /* Volume slider inside player bar */
        .sidebar-volume {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 33%;
            max-width: 180px;
            justify-content: flex-end;
        }

        .volume-icon {
            opacity: 0.4;
            display: flex;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            cursor: pointer;
            width: 100px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .volume-slider:hover::-webkit-slider-thumb {
            background: var(--neon-green);
            transform: scale(1.2);
        }

        /* Hidden YouTube Frame Container */
        #yt-player-wrapper {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* Loading Screen overlay */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            border-radius: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.4s ease, pointer-events 0.4s ease;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(57, 255, 20, 0.1);
            border-radius: 50%;
            border-top-color: var(--neon-green);
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .loaded .loader-overlay {
            opacity: 0;
            pointer-events: none;
        }

        /* RESPONSIVE LAYOUT (Mobile) */
        @media(max-width: 720px) {
            .player-card {
                flex-direction: column;
                height: 94vh;
                max-height: 780px;
            }

            .player-top-section {
                flex-direction: column;
                height: calc(100% - 90px);
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 12px 16px;
                gap: 12px;
            }

            .brand-header {
                font-size: 18px;
                padding-bottom: 4px;
            }

            .sidebar-menu {
                flex-direction: row;
                justify-content: space-between;
                gap: 4px;
            }

            .nav-btn {
                flex-grow: 1;
                font-size: 11px;
                padding: 10px 8px;
                justify-content: center;
                gap: 6px;
            }

            .main-content {
                padding: 16px;
            }

            .screen-title {
                font-size: 18px;
            }

            /* Mobile bottom player layout refinement */
            .bottom-player {
                height: 90px;
                padding: 12px 16px;
            }

            .bottom-player .mini-meta {
                width: 55%;
            }

            .mini-cover-art-container {
                width: 44px;
                height: 44px;
                border-radius: 6px;
            }

            .mini-title {
                font-size: 13px;
            }

            .mini-artist {
                font-size: 10px;
            }

            .bottom-player .playback-controls {
                width: 40%;
                gap: 12px;
            }

            .mini-control-btn.btn-play-pause {
                width: 42px;
                height: 42px;
            }

            .bottom-player .sidebar-volume {
                display: none; /* Hide volume bar on mobile to optimize space */
            }
        }
    </style>
</head>
<body>

    <!-- Soft green ambient light -->
    <div class="ambient-bg">
        <div class="glow-blob"></div>
    </div>

    <!-- Hidden native YouTube player container -->
    <div id="yt-player-wrapper">
        <div id="yt-player"></div>
    </div>

    <!-- Wide Player Card Layout (Spotify Desktop Style) -->
    <div class="player-card" id="player-container">
        
        <!-- Loading Overlay -->
        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">SE ÎNCARCĂ RADIOSIX...</div>
        </div>

        <!-- TOP CONTAINER (Sidebar + Scrollable content area) -->
        <div class="player-top-section">
            
            <!-- LEFT SIDEBAR (Menu Only) -->
            <aside class="sidebar">
                <div class="brand-header">
                    <span class="brand-dot"></span>
                    <span>RadioSIX</span>
                </div>
                
                <!-- Vertical Menu Navigation -->
                <nav class="sidebar-menu">
                    <button class="nav-btn active" id="nav-all">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                        </svg>
                        <span>ALL (Shuffle)</span>
                    </button>
                    
                    <button class="nav-btn" id="nav-recents">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm3.3 14.3L11 12.8V7h1.5v4.9l3.8 2.25-.81 1.15z"/>
                        </svg>
                        <span>RECENTS</span>
                    </button>
                    
                    <button class="nav-btn" id="nav-albums">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 2C6.48 2 2 6.48 2 12s6.48 10 10 10 10-6.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                        </svg>
                        <span>ALBUME</span>
                    </button>
                </nav>
            </aside>

            <!-- RIGHT MAIN CONTAINER -->
            <main class="main-content">
                
                <!-- ALL MODE SCREEN -->
                <section class="content-screen active" id="screen-all">
                    <div class="screen-title-area">
                        <h2 class="screen-title">ALL (Shuffle)</h2>
                        <span class="screen-subtitle">Coada de redare se reînnoiește automat după ce o piesă este redată</span>
                    </div>
                    <div style="margin-top: 18px;">
                        <div class="track-list" id="queue-tracklist">
                            <!-- Shuffled list populated by JS -->
                        </div>
                    </div>
                </section>

                <!-- RECENTS SEQUENTIAL SCREEN -->
                <section class="content-screen" id="screen-recents">
                    <div class="screen-title-area">
                        <h2 class="screen-title">RECENTS</h2>
                        <span class="screen-subtitle">Lansări recente în ordine cronologică (de la cea mai nouă la cea mai veche)</span>
                    </div>
                    <div style="margin-top: 18px;">
                        <div class="track-list" id="recents-tracklist">
                            <!-- Recent tracks list populated by JS -->
                        </div>
                    </div>
                </section>

                <!-- ALBUMS LIST SCREEN -->
                <section class="content-screen" id="screen-albums">
                    <div class="screen-title-area">
                        <h2 class="screen-title">ALBUME</h2>
                        <span class="screen-subtitle">Alege un album pentru redare integrală</span>
                    </div>
                    <div style="margin-top: 18px;">
                        <div class="albums-grid" id="albums-grid">
                            <!-- Albums list rows populated by JS -->
                        </div>
                    </div>
                </section>

            </main>
        </div>

        <!-- BOTTOM PLAYER CONTROLLER - LARGE & WIDE -->
        <footer class="bottom-player">
            
            <!-- Metadata Area (Left) -->
            <div class="mini-meta">
                <div class="mini-cover-art-container">
                    <img class="mini-cover-art" id="song-cover" src="" alt="Album Cover">
                </div>
                <div class="mini-details">
                    <div class="mini-title" id="song-title">Se conectează...</div>
                    <div class="mini-artist">Ilie Lascu</div>
                </div>
            </div>

            <!-- Playback controls (Center) -->
            <div class="playback-controls">
                <!-- Loop Button -->
                <button class="mini-control-btn btn-loop" id="btn-loop" title="Repetă piesa curentă (Loop)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                    </svg>
                </button>

                <!-- Play/Pause -->
                <button class="mini-control-btn btn-play-pause" id="btn-play" title="Redare / Pauză">
                    <svg id="play-icon" viewBox="0 0 24 24" width="22" height="22" fill="white">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" width="22" height="22" fill="white" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Next -->
                <button class="mini-control-btn btn-next" id="btn-next" title="Următoarea piesă">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume Area (Right) -->
            <div class="sidebar-volume">
                <div class="volume-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="var(--text-muted)">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </div>
                <input class="volume-slider" type="range" id="volume" min="0" max="100" value="80">
            </div>

        </footer>

    </div>

    <!-- YouTube IFrame Player API -->
    <script>

        const songsList = [
          {

            "cover": "assets/pedro.webp"
          },
          {
            "title": "The Caspian Response",
            "youtube_id": "seUt7yYsjbA",
            "cover": "assets/thecaspianresponse.webp"
          },
          {
            "title": "Museum ohne Morgen",
            "youtube_id": "Z8PGQtAVyVs",
            "cover": "assets/museumohnemorgen.webp"
          },
          {
            "title": "No More Midnight",
            "youtube_id": "t-CGRuizfYA",
            "cover": "assets/no_more_midnight.webp"
          },
          {
            "title": "The Synthesis of a Latino",
            "youtube_id": "2R9f6qs6K-E",
            "cover": "assets/thesynthesisofalatino.webp"
          }
        ];

        // 10 Albums with their corresponding YouTube playlist IDs
        const albumsList = [
          { "title": "Analog Dysfunctions", "playlist_id": "PLZAWstSOFR4Q", "tracks_count": 5 },
          { "title": "One Finger", "playlist_id": "PLQiiezDTDfPQ", "tracks_count": 7 },
          { "title": "Trópico Loco", "playlist_id": "PLI6HrnkL1XM0", "tracks_count": 14 },
          { "title": "The Perfect World", "playlist_id": "PLa27-86VNm1Q", "tracks_count": 6 },
          { "title": "Singles 2026", "playlist_id": "PLmvmJ6LhMAd9pnoM5clw7CjlXM-ifzzIb", "tracks_count": 33 },
          { "title": "Parallel Worlds", "playlist_id": "PLmvmJ6LhMAd8HnCHaWPCIZy9WQVEzvJUU", "tracks_count": 8 },
          { "title": "Punjabi Light Rituals", "playlist_id": "PLmvmJ6LhMAd-44sPihTl11-XzwKk5N_CX", "tracks_count": 3 },
          { "title": "Red Dust Rituals", "playlist_id": "PLmvmJ6LhMAd8pthubnkRZYvb7WBjjDdCn", "tracks_count": 3 },
          { "title": "Voices of the World's Children", "playlist_id": "PLmvmJ6LhMAd85MvKFb9m7VTf1TtsiCp1A", "tracks_count": 10 },
          { "title": "Synthetic Nirvana", "playlist_id": "PLmvmJ6LhMAd_bwFhtbGxHj4c2MchGHmJt", "tracks_count": 8 }
        ];

        let player;
        let isPlaying = false;
        
        // Mode & State variables
        let playMode = 'ALL'; // 'ALL', 'RECENTS', 'ALBUMS'
        let currentQueue = []; // Holds the current shuffled order of 10 songs for ALL mode
        let queueIndex = 0; // Current pointer in the shuffled queue
        let currentSequentialIndex = -1; // Pointer for RECENTS mode (plays Latino down to Rumba)
        let activePlaylistId = null; // Currently selected album playlist ID
        let isLooping = false; // Single song repeat state

        // Load YouTube Player API asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Elements
        const songTitle = document.getElementById('song-title');
        const songCover = document.getElementById('song-cover');
        const btnPlay = document.getElementById('btn-play');
        const btnNext = document.getElementById('btn-next');
        const btnLoop = document.getElementById('btn-loop');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const volumeSlider = document.getElementById('volume');
        
        // Navigation Buttons
        const navAll = document.getElementById('nav-all');
        const navRecents = document.getElementById('nav-recents');
        const navAlbums = document.getElementById('nav-albums');
        
        // Screen containers
        const screenAll = document.getElementById('screen-all');
        const screenRecents = document.getElementById('screen-recents');
        const screenAlbums = document.getElementById('screen-albums');
        
        // Dynamic Lists Containers
        const queueTracklist = document.getElementById('queue-tracklist');
        const recentsTracklist = document.getElementById('recents-tracklist');
        const albumsGrid = document.getElementById('albums-grid');

        // Create player after API loads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                videoId: '',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'showinfo': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            document.body.classList.add('loaded');
            player.setVolume(volumeSlider.value);

            // Initialize Lists
            initQueue();
            renderQueue();
            renderRecents();
            renderAlbumsGrid();

            // Start playing the first item in the ALL queue automatically
            playQueueIndex(0);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
                setTimeout(updateMetadata, 300);
            }
            
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.CUED) {
                if (event.data === YT.PlayerState.PAUSED) {
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                }
                
                // If song ended naturally
                if (event.data === YT.PlayerState.ENDED) {
                    if (isLooping) {
                        player.playVideo();
                    } else {
                        // CRITICAL FIX: Only call auto-advance in ALL and RECENTS.
                        // YouTube player naturally auto-advances playlists in Album mode!
                        if (playMode !== 'ALBUMS') {
                            playNextSong();
                        }
                    }
                }
            }
        }

        function onPlayerError(event) {
            console.error("YouTube Player Error: ", event.data);
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            songTitle.textContent = "Eroare la redare";
        }

        // --- ALL MODE QUEUE LOGIC ---
        function initQueue() {
            // Shuffle the songsList to create our current queue
            currentQueue = [...songsList];
            for (let i = currentQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQueue[i], currentQueue[j]] = [currentQueue[j], currentQueue[i]];
            }
            queueIndex = 0;
        }

        function playQueueIndex(index) {
            if (index < 0 || index >= currentQueue.length) return;
            queueIndex = index;
            playMode = 'ALL';
            
            // Highlight active in UI
            document.querySelectorAll('#queue-tracklist .track-item').forEach((item, idx) => {
                if (idx === queueIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            const song = currentQueue[queueIndex];
            player.loadVideoById(song.youtube_id);
            updateMetadata();
        }

        // --- RECENTS MODE SEQUENTIAL LOGIC ---
        function playRecentsIndex(index) {
            if (index < 0 || index >= songsList.length) return;
            // Map the layout index backwards to play Latino (newest) down to Rumba (oldest)
            currentSequentialIndex = songsList.length - 1 - index; 
            playMode = 'RECENTS';
            
            document.querySelectorAll('#recents-tracklist .track-item').forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            const song = songsList[currentSequentialIndex];
            player.loadVideoById(song.youtube_id);
            updateMetadata();
        }

        // --- ALBUMS PLAYING LOGIC ---
        function playAlbumPlaylist(playlistId, element) {
            playMode = 'ALBUMS';
            activePlaylistId = playlistId;
            
            document.querySelectorAll('.album-card').forEach(card => {
                card.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }
            
            player.loadPlaylist({
                list: activePlaylistId,
                index: 0,
                startSeconds: 0,
                suggestedQuality: 'default'
            });
        }

        // --- PLAYBACK ADVANCE LOGIC ---
        function playNextSong() {
            if (playMode === 'ALL') {
                queueIndex++;
                if (queueIndex >= currentQueue.length) {
                    // Queue finished! Reshuffle
                    initQueue();
                    renderQueue();
                }
                playQueueIndex(queueIndex);
            } else if (playMode === 'RECENTS') {
                if (currentSequentialIndex === -1) {
                    currentSequentialIndex = songsList.length - 1;
                } else {
                    currentSequentialIndex = (currentSequentialIndex - 1 + songsList.length) % songsList.length;
                }
                const viewIndex = songsList.length - 1 - currentSequentialIndex;
                playRecentsIndex(viewIndex);
            } else if (playMode === 'ALBUMS') {
                player.nextVideo();
            }
        }

        // --- UI METADATA UPDATE ---
        function updateMetadata() {
            if (!player) return;
            
            if (playMode === 'ALBUMS') {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    let rawTitle = videoData.title;
                    let cleanTitle = rawTitle.replace(/^Ilie Lascu\s*-\s*/i, '')
                                            .replace(/\s*\(Official.*?\)/i, '')
                                            .replace(/\s*\(Audio.*?\)/i, '')
                                            .trim();
                    songTitle.textContent = cleanTitle;
                    
                    const videoId = videoData.video_id;
                    const matchingSong = songsList.find(s => s.youtube_id === videoId);
                    
                    if (matchingSong) {
                        songCover.src = matchingSong.cover;
                    } else {
                        songCover.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    }
                    songCover.classList.add('loaded');
                }
            } else {
                const song = (playMode === 'ALL') ? currentQueue[queueIndex] : songsList[currentSequentialIndex];
                if (song) {
                    songTitle.textContent = song.title;
                    songCover.classList.remove('loaded');
                    songCover.src = song.cover;
                    songCover.onload = () => {
                        songCover.classList.add('loaded');
                    };
                    
                    syncListsHighlights(song.youtube_id);
                }
            }
        }

        function syncListsHighlights(videoId) {
            // Highlight inside ALL Queue list
            document.querySelectorAll('#queue-tracklist .track-item').forEach((item) => {
                if (item.getAttribute('data-youtube-id') === videoId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // Highlight inside RECENTS list
            document.querySelectorAll('#recents-tracklist .track-item').forEach((item) => {
                if (item.getAttribute('data-youtube-id') === videoId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // --- DOM RENDERERS ---
        
        // ALL tab queue list
        function renderQueue() {
            queueTracklist.innerHTML = '';
            currentQueue.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `track-item ${idx === queueIndex && playMode === 'ALL' ? 'active' : ''}`;
                item.setAttribute('data-youtube-id', song.youtube_id);
                item.innerHTML = `
                    <div class="track-left">
                        <span class="track-num">${idx + 1}</span>
                        <img class="track-cover-mini" src="${song.cover}" alt="">
                        <div class="track-details">
                            <span class="track-name">${song.title}</span>
                        </div>
                    </div>
                    <div class="track-playing-indicator">
                        <span>Redă</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--neon-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                        </svg>
                    </div>
                `;
                item.addEventListener('click', () => {
                    playQueueIndex(idx);
                });
                queueTracklist.appendChild(item);
            });
        }

        // RECENTS sequential releases list
        function renderRecents() {
            recentsTracklist.innerHTML = '';
            const reversedList = [...songsList].reverse();
            reversedList.forEach((song, idx) => {
                const originalIndex = songsList.length - 1 - idx;
                const isActive = (playMode === 'RECENTS' && originalIndex === currentSequentialIndex);
                
                const item = document.createElement('div');
                item.className = `track-item ${isActive ? 'active' : ''}`;
                item.setAttribute('data-youtube-id', song.youtube_id);
                item.innerHTML = `
                    <div class="track-left">
                        <span class="track-num">${idx + 1}</span>
                        <img class="track-cover-mini" src="${song.cover}" alt="">
                        <div class="track-details">
                            <span class="track-name">${song.title}</span>
                        </div>
                    </div>
                    <div class="track-playing-indicator">
                        <span>Redă</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--neon-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                        </svg>
                    </div>
                `;
                item.addEventListener('click', () => {
                    playRecentsIndex(idx);
                });
                recentsTracklist.appendChild(item);
            });
        }

        // List of Albums (Clean row list style)
        function renderAlbumsGrid() {
            albumsGrid.innerHTML = '';
            albumsList.forEach((album, idx) => {
                const isActive = (playMode === 'ALBUMS' && activePlaylistId === album.playlist_id);
                const card = document.createElement('div');
                card.className = `album-card ${isActive ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="track-left">
                        <span class="track-num">${idx + 1}</span>
                        <span style="font-size: 20px; width: 32px; text-align: center; display: inline-block;">💿</span>
                        <div class="track-details">
                            <span class="album-title">${album.title}</span>
                            <span class="album-tracks-count">${album.tracks_count} piese</span>
                        </div>
                    </div>
                    <div class="track-playing-indicator">
                        <span>Redă</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--neon-green)">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                        </svg>
                    </div>
                `;
                card.addEventListener('click', () => {
                    playAlbumPlaylist(album.playlist_id, card);
                });
                albumsGrid.appendChild(card);
            });
        }

        // --- SIDEBAR SCREEN CONTROLLER ---
        function showScreen(screenId, navElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            navElement.classList.add('active');
            
            screenAll.classList.remove('active');
            screenRecents.classList.remove('active');
            screenAlbums.classList.remove('active');
            
            document.getElementById(screenId).classList.add('active');
        }

        navAll.addEventListener('click', () => {
            showScreen('screen-all', navAll);
            if (playMode !== 'ALL') {
                playMode = 'ALL';
                playQueueIndex(queueIndex);
            }
        });

        navRecents.addEventListener('click', () => {
            showScreen('screen-recents', navRecents);
            if (playMode !== 'RECENTS') {
                playMode = 'RECENTS';
                if (currentSequentialIndex === -1) {
                    playRecentsIndex(0);
                } else {
                    const viewIndex = songsList.length - 1 - currentSequentialIndex;
                    playRecentsIndex(viewIndex);
                }
            }
        });

        navAlbums.addEventListener('click', () => {
            showScreen('screen-albums', navAlbums);
            renderAlbumsGrid();
        });

        // --- CONTROLS BINDINGS ---
        btnPlay.addEventListener('click', () => {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        btnNext.addEventListener('click', () => {
            playNextSong();
        });

        // Loop Toggle
        btnLoop.addEventListener('click', () => {
            isLooping = !isLooping;
            if (isLooping) {
                btnLoop.classList.add('active');
            } else {
                btnLoop.classList.remove('active');
            }
        });

        // Volume Bar
        volumeSlider.addEventListener('input', (e) => {
            if (player) {
                player.setVolume(e.target.value);
            }
        });
    </script>
</body>
</html>
